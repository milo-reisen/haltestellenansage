<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Haltestellenansage – Milo Reisen</title>
<meta name="description" content="Haltestellenansage mit Fahrtverlauf für die Busse von Milo Reisen">
<meta name="theme-color" content="#1f75ae">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=be33064ce2">
<script>window.HSA = {"version": "2.3.0", "stand": "37302aa79a"};</script>
</head>
<body>

<!-- Fahrplanauswahl (für den Fahrer) -->
<main id="auswahl" class="auswahl">
  <header class="aw-band">
    <img class="aw-logo" src="logo/schriftzug-hell.png" alt="Milo Reisen">
    <div class="aw-titel">Haltestellenansage</div>
  </header>
  <div class="aw-inhalt">
    <h1 class="aw-h">Fahrplan antippen</h1>
    <div id="aw-liste" class="aw-liste"><p class="leer">Fahrpläne werden geladen …</p></div>
  </div>
  <footer class="aw-fuss">
    <button id="bt-einst" class="zweit" type="button">Einstellungen</button>
    <span id="aw-version" class="aw-version"></span>
  </footer>
</main>

<!-- Fahrgastanzeige (wird auf die Monitore gespiegelt) -->
<section id="anzeige" class="anzeige" hidden aria-live="polite">
  <header class="kopf">
    <img id="az-symbol" class="kopf-sym" src="bilder/sev.png" alt="">
    <span id="az-linie" class="kopf-linie">S11</span>
    <span class="kopf-ziel"><span><small id="az-art">Ersatzverkehr nach</small><b id="az-ziel"></b></span></span>
    <span id="az-uhr" class="kopf-uhr"></span>
  </header>
  <section class="naechster">
    <button id="az-knopf" class="ansagen" type="button">
      <span id="az-knopf-t">Nächste Haltestelle</span>
      <i id="az-knopf-zeit" class="zeit" hidden></i>
    </button>
    <div class="name"><span id="az-name"></span></div>
  </section>
  <section class="band">
    <i class="schiene"></i>
    <ol id="az-band"></ol>
  </section>
</section>

<!-- Fahrermenü: erscheint nach Antippen der Anzeige, verschwindet von selbst -->
<div id="steuer" class="steuer" hidden>
  <div class="st-zeile"><span id="st-status" class="st-status"></span></div>
  <div class="st-knoepfe">
    <button type="button" data-a="zurueck">◀&#xFE0E; Halt zurück</button>
    <button type="button" data-a="weiter">Halt weiter ▶&#xFE0E;<small>ohne Ansage</small></button>
    <button type="button" data-a="wiederholen">Ansage wiederholen</button>
    <button type="button" data-a="begruessung">Begrüßung abspielen</button>
    <button type="button" data-a="rueck" id="st-rueck" class="haupt" hidden>Rückfahrt</button>
    <button type="button" data-a="beenden" id="st-ende">Fahrt beenden</button>
  </div>
  <div id="st-meldung" class="st-meldung" hidden></div>
</div>

<!-- Einstellungen -->
<dialog id="einst" class="einst">
  <form method="dialog" class="ei-form">
    <h2>Einstellungen</h2>
    <label class="ei-zeile">Nach der Ansage wechselt die Anzeige zum nächsten Halt nach
      <select id="ei-wechsel">
        <option value="60">1 Minute</option>
        <option value="90">1½ Minuten</option>
        <option value="120" selected>2 Minuten</option>
        <option value="180">3 Minuten</option>
        <option value="300">5 Minuten</option>
        <option value="10">10 Sekunden (zum Ausprobieren)</option>
      </select>
    </label>
    <label><input type="checkbox" id="ei-begr" checked> Begrüßung abspielen, wenn der Fahrplan angetippt wird</label>
    <label><input type="checkbox" id="ei-autorueck" checked> Nach dem Endhalt von selbst die Rückfahrt anzeigen</label>
    <div class="ei-zeile">
      <span>Lautsprecher prüfen</span>
      <button type="button" id="ei-tontest" class="zweit">Testansage</button>
    </div>
    <div class="ei-zeile">
      <span id="ei-version"></span>
      <button type="button" id="ei-neu" class="zweit">Neu laden</button>
    </div>
    <p class="ei-hinweis">Die Lautstärke stellst du mit den Lautstärketasten am Tablet ein.</p>
    <div class="ei-ende"><button class="haupt" value="ok">Fertig</button></div>
  </form>
</dialog>

<script src="fahrt.js?v=9535e2f8e5"></script>
<script src="app.js?v=e1ec270f0f"></script>
</body>
</html>
